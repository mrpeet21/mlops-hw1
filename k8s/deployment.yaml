apiVersion: apps/v1
kind: Deployment
metadata:
  name: cancer-service
spec:
  replicas: 2

  selector:
    matchLabels:
      app: cancer-service

  template:
    metadata:
      labels:
        app: cancer-service

    spec:
      containers:
        - name: api
          image: cancer-service:1.0
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: cancer-config
            - secretRef:
                name: cancer-secret
                
          ports:
            - containerPort: 8000

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            timeoutSeconds: 5
            failureThreshold: 90
            periodSeconds: 5

          livenessProbe:
            tcpSocket:
              port: 8000
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 6

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            timeoutSeconds: 5
            periodSeconds: 5

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"