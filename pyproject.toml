[project]
name = "cancer-service"
version = "0.1.0"
description = "FastAPI service for breast cancer classification"
readme = "README.md"
authors = [
    { name = "mrpeet21", email = "ekaterina_petrova_a@inbox.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "mlflow>=3.16.1",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.uv.build-backend]
module-name = "cancer_service"
